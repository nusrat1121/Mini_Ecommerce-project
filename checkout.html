<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="container" style="max-width: 600px; margin: 50px auto; font-family: 'Poppins', sans-serif;">
</div>

<div class="container" style="max-width: 600px; margin: 50px auto;">
    
    {% if success %}
        <div style="text-align: center; padding: 40px;">
            <h1 style="color: green;">✔ Order Placed Successfully!</h1>
            <p>Thank you for shopping with Jennifer's Collection.</p>
            <a href="{{ url_for('home') }}" class="btn-shop">Back to Home</a>
        </div>
    {% else %}
        <h2>Delivery Information</h2>
        <hr>
        <p>Total Bill: <strong>৳{{ total }}</strong></p>
        
        <form method="POST">
            <div style="margin-bottom: 15px;">
                <label>Full Name:</label>
                <input type="text" name="name" required style="width: 100%; padding: 10px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Address:</label>
                <textarea name="address" required style="width: 100%; padding: 10px;"></textarea>
            </div>
            <div style="margin-bottom: 15px;">
                <label>Phone:</label>
                <input type="text" name="phone" required style="width: 100%; padding: 10px;">
            </div>
            <button type="submit" class="btn-shop" style="width: 100%;">Confirm Order</button>
        </form>
    {% endif %}

</div>
