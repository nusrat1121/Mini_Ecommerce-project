<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Jennifer's Beautiful collections</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-container">
    <div class="auth-box">
        <div class="logo" style="justify-content: center; margin-bottom: 20px;">
            <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Jennifer's Beautiful collections" class="nav-logo">
        </div>
        <h2>Welcome Back</h2>
        <p>Please login to your account</p>

        <form action="/login" method="POST">
            <div class="input-field">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="input-field">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-shop" style="width: 100%; border: none;">Login</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Register Now</a></p>
        <a href="{{ url_for('home') }}" class="back-link">Back to Home</a>
    </div>
</div>
    
</body>
</html>
