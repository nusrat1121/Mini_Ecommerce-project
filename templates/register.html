<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Jennifer's Beautiful collections</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-body"> <div class="auth-container">
        <div class="auth-box">
            <div class="logo" style="justify-content: center; margin-bottom: 20px;">
                <img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Jennifer's Beautiful collections" class="nav-logo">
            </div>
            
            <h2>Create Account</h2>
            <p>Sign up to start shopping with us</p>
            
<form  action="/register" method="POST">
            <div class="input-field">
                <i class="fas fa-user"></i>
                <input type="text" name="fullname" placeholder="Full Name" required>
            </div>
            
            <div class="input-field">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Email Address" required>
            </div>
            
            <div class="input-field">
                <i class="fas fa-lock"></i>
                <input type="password" name="password" placeholder="Create Password" required>
            </div>

            <button type="submit" class="btn-shop" style="width: 100%; border: none;">Register Now</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Login Here</a></p>
        <a href="{{ url_for('home') }}" class="back-link">Back to Home</a>
    </div>
</div>

    
</body>
</html>
