<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results for "{{ query }}"</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container" style="padding: 50px 8%;">
        <h2>Search Results for: <span style="color: #e91e63;">"{{ query }}"</span></h2>
        <a href="/" style="text-decoration: none; color: #e91e63; font-weight: bold;">← Back to Home</a>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        {% if products %}
            <div class="product-grid" style="display: flex; gap: 20px; flex-wrap: wrap;">
                {% for product in products %}
                    <div class="product-card" style="width: 250px; border: 1px solid #ddd; padding: 15px; border-radius: 8px;">
                        <img src="{{ url_for('static', filename=product.image) }}" alt="{{ product.name }}" style="width: 100%; height: 250px; object-fit: cover;">
                        <h3>{{ product.name }}</h3>
                        <p style="color: #e91e63; font-weight: bold;">Tk. {{ product.price }}</p>
                        <a href="{{ url_for('add_to_cart', product_id=product.id) }}" class="btn-shop" style="display: block; text-align: center; background: #e91e63; color: white; padding: 10px; text-decoration: none; border-radius: 5px;">Add to Bag</a>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div style="text-align: center; padding: 50px;">
                <p style="font-size: 18px; color: #666;">No products found matching your search. Try something else!</p>
            </div>
        {% endif %}
    </div>

</body>
</html>
